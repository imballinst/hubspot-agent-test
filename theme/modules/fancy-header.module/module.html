{% require_css %}
  <style>
    {% scope_css %}

      .focus_module_fancy_header {
        color: {{ module.styles.color.color }};
      }

      .focus_module_fancy_header::after {
        background-color: {{ module.styles.color.color }};
      }

    {% end_scope_css %}
  </style>
{% end_require_css %}

{% set align_class = " focus_centered" if module.align_content is equalto "center" else "" %}

<div class="focus_module_fancy_header_container{{ align_class }}">
  <{{ module.title_heading_type }} class="focus_module_fancy_header {{ 'huge' if module.huge }}">{{ module.text }}</{{ module.title_heading_type }}>
</div>
