<div class="focus_module_breadcrumb">
    {% if module.root_text %}
        <a href="{{ company_domain }}" class="focus_module_breadcrumb-root_item">{{ module.root_text }}</a>
        <span class="root-item-divider"></span>
    {% endif %}
    {% if module.menu|string != 'Choose a menu' %}
        {% menu "focus_breadcrumb" id={{ module.menu }}, overrideable=False, root_type="breadcrumb", flyouts="false", max_levels="1" %}
    {% endif %}
</div>
